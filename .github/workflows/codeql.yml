# GitHub code scanning for the Swift app and the C++ root helper. Results appear under
# the repository's Security tab.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # weekly, to pick up new CodeQL queries
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        language: [swift, c-cpp]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended
      - run: TYPETHRU_APP=.build/check/TypeThru.app scripts/build.sh
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

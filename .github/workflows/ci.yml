# Runs the same checks as make check (tests, build, audit) on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Liquid Glass needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/cache@v4
        with:
          path: .build/virtualhid-source
          key: driver-source-${{ hashFiles('scripts/build.sh') }}
      - run: brew install shellcheck gitleaks
      - run: make check
